<?xml version="1.0" encoding="UTF-8"?>
<!-- Ancestral Baby app icon — tomahawk steak.
     Palette: butter #FCEFC7 tile, navy #30384D keyline, coral ribeye, cream bone.
     1024x1024 master; rasterise to Android launcher densities.
     Ribeye is an irregular organic outline (not a perfect ellipse) so it reads
     as a real cut of meat. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E89A78"/>
      <stop offset="1" stop-color="#D2785A"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#FCEFC7"/>

  <!-- steak, tilted for a bit of energy -->
  <g transform="rotate(-13 512 512)" stroke="#30384D" stroke-width="26"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- bone: frenched rib shaft + double knuckle (drawn first, behind meat) -->
    <path d="M 545 545 L 815 405" fill="none" stroke="#30384D" stroke-width="96"/>
    <path d="M 545 545 L 815 405" fill="none" stroke="#F6EEDB" stroke-width="52"/>
    <g>
      <circle cx="835" cy="392" r="62" fill="#F6EEDB"/>
      <circle cx="806" cy="450" r="54" fill="#F6EEDB"/>
    </g>

    <!-- ribeye: irregular, organic outline — flatter top, an asymmetric cap-
         muscle lobe on the upper-left, lumpy lower edge. Reads as a real cut,
         not a perfect oval. -->
    <path d="M 432 388
             C 548 380 604 414 636 476
             C 678 536 668 608 644 668
             C 614 750 540 796 430 804
             C 326 812 240 776 198 704
             C 172 658 166 600 184 546
             C 156 498 178 450 234 446
             C 280 442 300 468 328 462
             C 352 422 388 396 432 388 Z"
          fill="url(#meat)"/>

    <!-- fat cap: cream band along the outer (lower-left) rim, just inside the
         keyline. -->
    <path d="M 206 628
             C 178 694 214 754 296 790"
          fill="none" stroke="#F6EEDB" stroke-width="36"
          stroke-linecap="round" opacity="0.9"/>

    <!-- marbling: thin cream veins, irregular and branching. -->
    <g stroke="#F6EEDB" stroke-width="13" stroke-linecap="round" fill="none"
       opacity="0.8">
      <path d="M 336 466 q 54 66 20 150"/>
      <path d="M 438 496 q 44 60 -8 166"/>
      <path d="M 366 648 q 80 14 132 -28"/>
      <path d="M 280 556 q 38 28 10 92"/>
    </g>
  </g>
</svg>
